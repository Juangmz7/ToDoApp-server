services:
  app:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://pgvector:5432/ToDoApp # Intern URL connection
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # --- Point the app to the new Ollama container ---
      - SPRING_AI_OLLAMA_BASE-URL=http://ollama:11434
    ports:
      - "8081:8081"
    depends_on:
      - pgvector
      - redis
      - ollama
    networks:
      - my-network

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    networks:
      - my-network

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ToDoApp
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - "5433:5432"
    networks:
      - my-network

  # --- This is the full and correct Ollama service definition ---
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

# --- This volume makes your Ollama models persistent ---
volumes:
  ollama-data:

