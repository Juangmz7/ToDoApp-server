
services:
  app:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/ToDoApp # Intern URL connection
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - my-network


  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ToDoApp
    ports:
      - 5433:5432
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
