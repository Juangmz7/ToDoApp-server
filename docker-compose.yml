
services:
  app:
    build: .
    ports:
      - "8081:8081"
    networks:
      - my-network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ToDoApp
    ports:
      - 5433:5432
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
