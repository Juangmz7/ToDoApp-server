spring:
  application:
    name: ToDoApp

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: postgres

  data:
    redis:
      host: redis
      port: 6379

  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: gpt-3.5-turbo
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000

  main:
    allow-bean-definition-overriding: true

server:
  port: 8081
logging:
    level:
      org.springframework.ai: DEBUG
      org.springframework.web.client.RestTemplate: DEBUG
